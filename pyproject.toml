[project]
name = "five-lang-translator"
version = "1.0.3"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "qasync>=0.27,<1", "numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
audio = ["PyAudioWPatch>=0.2.12.8", "silero-vad>=6,<7", "onnxruntime>=1.18,<2"]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5"]

[project.scripts]
five-lang-translator = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
